services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: interview_bot
      POSTGRES_USER: interview_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_bot -d interview_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=interview_bot;Username=interview_bot;Password=${POSTGRES_PASSWORD}"
    volumes:
      - ./seed:/app/seed:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
