            path: src/libraries/System.Private.CoreLib/src/System/Threading/Tasks/ValueTask.cs
            symbol: "public bool IsCompletedSuccessfully"
      - id: async.cancellation
        title: "Отмена: CancellationToken, linked CTS, таймауты"
        status: gap
        codeRefs:
          - repo: dotnet/runtime
            path: src/libraries/System.Private.CoreLib/src/System/Threading/CancellationTokenSource.cs
            symbol: "CreateLinkedTokenSource("
      - id: async.channels
        title: "Channel<T>, producer-consumer"
