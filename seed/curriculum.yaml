# Учебная программа бота. Редактируется руками, применяется при старте сервиса.
#
# id        — стабильный ключ темы; не меняй у существующих тем, иначе потеряется прогресс
# priority  — 1 (важнее) .. 3
# status    — начальный статус (new | gap | repeat | understood); применяется ТОЛЬКО при первом
#             появлении темы, дальше статус живёт в БД и меняется кнопками
# codeRefs  — откуда брать фрагмент кода: repo, path (от корня репозитория), symbol (строка, рядом с
#             которой искать фрагмент). Пути проверены на момент написания; если файл переедет,
#             блок «код из репозитория» для темы просто пропустится.
#
# Удалённая из файла тема не удаляется из БД, а помечается неактивной (прогресс сохраняется).

modules:
  - number: 1
    title: Многопоточность и async
    priority: 1
    topics:
      - id: threading.interlocked
        title: "Атомарность и Interlocked, CompareExchange"
        status: gap
        codeRefs:
          - repo: dotnet/runtime
            path: src/libraries/System.Private.CoreLib/src/System/Collections/Concurrent/ConcurrentQueueSegment.cs
            symbol: "public bool TryEnqueue("
      - id: threading.lock-monitor
        title: "lock и Monitor, дедлок и как его воспроизвести"
        status: gap
        codeRefs:
          - repo: dotnet/runtime
            path: src/libraries/System.Private.CoreLib/src/System/Threading/Lock.cs
            symbol: "public Scope EnterScope("
      - id: threading.semaphoreslim
        title: "SemaphoreSlim, WaitAsync, ограничение параллелизма"
        status: gap
        codeRefs:
          - repo: dotnet/runtime
            path: src/libraries/System.Private.CoreLib/src/System/Threading/SemaphoreSlim.cs
            symbol: "WaitAsync("
      - id: threading.concurrent-collections
        title: "ConcurrentDictionary / Bag / Queue, подводные камни GetOrAdd"
