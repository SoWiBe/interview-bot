            path: src/libraries/System.Private.CoreLib/src/System/Runtime/CompilerServices/AsyncTaskMethodBuilderT.cs
            symbol: "AwaitUnsafeOnCompleted"
          - repo: dotnet/runtime
            path: src/libraries/System.Private.CoreLib/src/System/Threading/Tasks/Task.cs
            symbol: "public ConfiguredTaskAwaitable ConfigureAwait("
      - id: async.task-vs-valuetask
        title: "Task vs ValueTask"
        codeRefs:
