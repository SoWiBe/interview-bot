            symbol: "TryWrite("
      - id: async.parallel-foreach
        title: "Parallel.ForEachAsync vs Task.WhenAll + семафор"
        status: gap
        codeRefs:
          - repo: dotnet/runtime
            path: src/libraries/System.Threading.Tasks.Parallel/src/System/Threading/Tasks/Parallel.ForEachAsync.cs
            symbol: "ForEachAsync<TSource>("

  - number: 2
    title: Алгоритмы для live coding
    priority: 1
    topics:
